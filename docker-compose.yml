version: '3.8'

services:
  vault:
    build: .
    container_name: vault
    restart: unless-stopped
    ports:
      - "8844:8844"
    volumes:
      - ./data:/app/data
      - ./app/static/uploads:/app/app/static/uploads
    environment:
      # IMPORTANT: Change these before first start!
      - SECRET_KEY=bitte-aendern-langer-zufaelliger-string-hier
      - VAULT_USER=admin
      - VAULT_PASSWORD=vault1234
