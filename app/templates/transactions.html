{% extends "base.html" %}
{% block title %}Transaktionen – Vault{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Transaktionen</h1>
    <p class="page-sub" id="txCountLabel">Alle Buchungen</p>
  </div>
  <div class="btn-group">
    <button class="btn-ghost"   onclick="openAddTx('income')">📥 Einnahme</button>
    <button class="btn-primary" onclick="openAddTx('expense')">📤 Ausgabe</button>
  </div>
</div>

<div class="card">
  <div class="filter-bar">
    <div class="filter-group">
      <label>Typ</label>
      <select id="fType" onchange="applyFilters()">
        <option value="">Alle</option>
        <option value="income">Einnahmen</option>
        <option value="expense">Ausgaben</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Kategorie</label>
      <select id="fCat" onchange="applyFilters()">
        <option value="">Alle</option>
        {% for c in categories %}
        <option value="{{ c.id }}">{{ c.emoji }} {{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="filter-group">
      <label>Von</label>
      <input type="date" id="fFrom" onchange="applyFilters()">
    </div>
    <div class="filter-group">
      <label>Bis</label>
      <input type="date" id="fTo" onchange="applyFilters()">
    </div>
    <div class="filter-group" style="flex:2;min-width:200px">
      <label>Suche</label>
      <input type="text" id="fSearch" placeholder="Beschreibung…" oninput="debouncedFilter()">
    </div>
    <button class="btn-ghost" onclick="resetFilters()">✕ Zurücksetzen</button>
  </div>

  <div id="txListWrap">
    <div class="loading-state"><div class="spinner"></div><p>Lade…</p></div>
  </div>

  <div class="pagination hidden" id="pagination">
    <button class="btn-ghost" id="pgPrev" onclick="changePage(-1)">← Zurück</button>
    <span class="pg-info" id="pgInfo"></span>
    <button class="btn-ghost" id="pgNext" onclick="changePage(1)">Weiter →</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let _txPage = 1; const TX_PER_PAGE = 40;
let _debTimer = null;
function debouncedFilter() { clearTimeout(_debTimer); _debTimer = setTimeout(applyFilters, 380); }
function applyFilters() { _txPage = 1; refreshTxList(); }
function resetFilters() {
  ['fType','fCat','fFrom','fTo'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fSearch').value = '';
  applyFilters();
}
function changePage(d) { _txPage = Math.max(1, _txPage + d); refreshTxList(); }

async function refreshTxList() {
  const params = new URLSearchParams({
    type: document.getElementById('fType').value,
    category: document.getElementById('fCat').value,
    date_from: document.getElementById('fFrom').value,
    date_to:   document.getElementById('fTo').value,
    search:    document.getElementById('fSearch').value,
    page:      _txPage, per_page: TX_PER_PAGE,
  });
  const wrap = document.getElementById('txListWrap');
  wrap.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Lade…</p></div>';
  const data = await (await fetch('/api/transactions?' + params)).json();
  document.getElementById('txCountLabel').textContent = `${data.total} Transaktion${data.total !== 1 ? 'en' : ''}`;

  if (!data.transactions.length) {
    wrap.innerHTML = '<div class="empty-state"><span>💳</span><p>Keine Transaktionen gefunden.</p></div>';
    document.getElementById('pagination').classList.add('hidden');
    return;
  }

  wrap.innerHTML = '<div class="tx-list">' + data.transactions.map(t => `
    <div class="tx-item" id="txi-${t.id}">
      <div class="tx-icon" style="background:${t.category_color}22">
        ${t.image_path ? `<img class="tx-img-tiny" src="${t.image_path}" alt="">` : (t.emoji || t.category_emoji)}
      </div>
      <div class="tx-info">
        <span class="tx-desc">${escHtml(t.display_desc || t.description || 'Keine Beschreibung')}</span>
        <span class="tx-meta">
          <span>${t.date_display}</span>
          <span class="cat-badge" style="background:${t.category_color}22;color:${t.category_color}">${t.category_emoji} ${escHtml(t.category_name)}</span>
          ${t.note ? `<span class="note-badge" title="${escHtml(t.note)}">📝</span>` : ''}
        </span>
      </div>
      <span class="tx-amount ${t.type}">${t.type==='income' ? '+' : '-'}${t.amount.toLocaleString('de-DE',{minimumFractionDigits:2})} €</span>
      <div class="tx-actions">
        <button class="icon-btn-sm" onclick="openEditTx(${t.id})">✏️</button>
        <button class="icon-btn-sm danger" onclick="deleteTx(${t.id})">🗑️</button>
      </div>
    </div>`).join('') + '</div>';

  const pg = document.getElementById('pagination');
  if (data.pages > 1) {
    pg.classList.remove('hidden');
    document.getElementById('pgInfo').textContent = `Seite ${_txPage} von ${data.pages}`;
    document.getElementById('pgPrev').disabled = _txPage <= 1;
    document.getElementById('pgNext').disabled = _txPage >= data.pages;
  } else {
    pg.classList.add('hidden');
  }
}
document.addEventListener('DOMContentLoaded', refreshTxList);
</script>
{% endblock %}
