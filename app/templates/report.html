{% extends "base.html" %}
{% block title %}Monatsbericht – Vault{% endblock %}
{% block content %}
<div class="page-header">
  <div><h1 class="page-title">Monatsbericht</h1><p class="page-sub" id="reportSub">Wähle einen Monat</p></div>
  <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap">
    <select id="monthPicker" onchange="loadReport()" style="width:auto;font-weight:600">
      {% for m in months %}
      <option value="{{ m }}">{{ m }}</option>
      {% endfor %}
    </select>
    <a id="csvLink" class="btn-ghost" style="display:none">📥 CSV</a>
    <button class="btn-primary" onclick="window.print()">🖨️ Drucken / PDF</button>
  </div>
</div>

<div id="reportContent">
  <div class="card"><div class="empty-state"><span>📋</span><p>Monat auswählen um den Bericht zu laden.</p></div></div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadReport() {
  const ym = document.getElementById('monthPicker').value;
  if (!ym) return;
  document.getElementById('reportContent').innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Lade…</p></div>';
  const data = await (await fetch(`/api/report?month=${ym}`)).json();
  document.getElementById('reportSub').textContent = data.month_label;
  document.getElementById('csvLink').href = `/api/report/csv?month=${ym}`;
  document.getElementById('csvLink').style.display = '';

  const s = data.summary;
  const txRows = data.transactions.map(t => `
    <tr>
      <td>${t.date_display}</td>
      <td>${escHtml(t.display_desc||t.description||'')}</td>
      <td>${escHtml(t.category_name)}</td>
      <td>${(t.tags||[]).map(tg=>`<span class="tag-chip">#${escHtml(tg)}</span>`).join('')}</td>
      <td style="text-align:right;font-weight:700;color:${t.type==='income'?'var(--income)':'var(--expense)'}">${t.type==='income'?'+':'-'}${t.amount.toLocaleString('de-DE',{minimumFractionDigits:2})} €</td>
    </tr>`).join('');

  const catRows = data.category_breakdown.map(c => `
    <tr>
      <td>${escHtml(c.name)}</td>
      <td style="text-align:right;font-weight:700">${c.amount.toLocaleString('de-DE',{minimumFractionDigits:2})} €</td>
    </tr>`).join('');

  document.getElementById('reportContent').innerHTML = `
    <!-- Summary cards -->
    <div class="stats-grid" style="margin-bottom:1.5rem">
      <div class="stat-card income-card"><span class="stat-icon">📥</span><div class="stat-body"><span class="stat-label">Einnahmen</span><span class="stat-value income-val">${s.income.toLocaleString('de-DE',{minimumFractionDigits:2})} €</span></div></div>
      <div class="stat-card expense-card"><span class="stat-icon">📤</span><div class="stat-body"><span class="stat-label">Ausgaben</span><span class="stat-value expense-val">${s.expenses.toLocaleString('de-DE',{minimumFractionDigits:2})} €</span></div></div>
      <div class="stat-card ${s.balance>=0?'balance-pos':'balance-neg'}"><span class="stat-icon">${s.balance>=0?'💰':'⚠️'}</span><div class="stat-body"><span class="stat-label">Bilanz</span><span class="stat-value ${s.balance>=0?'income-val':'expense-val'}">${s.balance.toLocaleString('de-DE',{minimumFractionDigits:2})} €</span></div></div>
      <div class="stat-card"><span class="stat-icon">📊</span><div class="stat-body"><span class="stat-label">Transaktionen</span><span class="stat-value">${s.count}</span></div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 280px;gap:1.1rem;align-items:start">
      <!-- Transaction table -->
      <div class="card" style="margin:0">
        <div class="card-header"><h3>Alle Transaktionen</h3></div>
        <div style="overflow-x:auto">
          <table class="review-table">
            <thead><tr><th>Datum</th><th>Beschreibung</th><th>Kategorie</th><th>Tags</th><th style="text-align:right">Betrag</th></tr></thead>
            <tbody>${txRows || '<tr><td colspan="5" style="text-align:center;color:var(--text-3);padding:2rem">Keine Transaktionen</td></tr>'}</tbody>
          </table>
        </div>
      </div>

      <!-- Category breakdown -->
      <div class="card" style="margin:0">
        <div class="card-header"><h3>Ausgaben nach Kategorie</h3></div>
        <table class="review-table">
          <thead><tr><th>Kategorie</th><th style="text-align:right">Betrag</th></tr></thead>
          <tbody>${catRows || '<tr><td colspan="2" style="color:var(--text-3)">–</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
}

document.addEventListener('DOMContentLoaded', () => {
  if (document.getElementById('monthPicker').value) loadReport();
});
</script>
<style>
@media print {
  .sidebar, .mob-menu-btn, .page-header .btn-primary, .page-header .btn-ghost,
  #toasts, .modal-backdrop { display: none !important; }
  .main { margin: 0; padding: 0; }
  .card { box-shadow: none; border: 1px solid #ddd; }
  body { background: white; color: black; }
}
</style>
{% endblock %}
