<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault – Anmelden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-wrap {
    width: min(420px, 92vw);
    background: var(--glass-sb);
    backdrop-filter: var(--blur);
    border: 1px solid var(--border-2);
    border-radius: var(--radius);
    padding: 2.5rem 2rem;
    box-shadow: var(--shadow);
  }
  .login-brand {
    display: flex; align-items: center; justify-content: center;
    gap: .75rem; margin-bottom: 2rem;
  }
  .login-brand-gem { font-size: 2.2rem; filter: drop-shadow(0 0 12px var(--accent-glow)); }
  .login-brand-name {
    font-size: 1.8rem; font-weight: 800; letter-spacing: -.03em;
    background: linear-gradient(135deg, var(--accent) 30%, var(--indigo));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .login-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.5rem; text-align: center; color: var(--text-2); }
  .login-error {
    background: var(--expense-dim); border: 1px solid rgba(251,113,133,.3);
    border-radius: var(--radius-sm); padding: .85rem 1rem;
    font-size: .85rem; color: var(--expense); margin-bottom: 1.25rem; line-height: 1.5;
  }
  .login-locked {
    background: var(--warning-dim); border: 1px solid rgba(251,146,60,.3);
    border-radius: var(--radius-sm); padding: .85rem 1rem;
    font-size: .85rem; color: var(--warning); margin-bottom: 1.25rem; line-height: 1.5;
  }
  .remember-row { display: flex; align-items: center; gap: .6rem; margin: 1rem 0; }
  .remember-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .remember-row label { font-size: .88rem; color: var(--text-2); cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .login-btn {
    width: 100%; padding: .8rem; border-radius: var(--radius-sm);
    background: var(--accent); color: #060a12;
    font-weight: 800; font-size: 1rem; font-family: inherit;
    border: none; cursor: pointer; margin-top: .5rem;
    transition: transform .15s, box-shadow .15s;
  }
  .login-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-glow); }
  .login-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .login-hint { font-size: .75rem; color: var(--text-3); text-align: center; margin-top: 1.25rem; line-height: 1.6; }

  /* Fix browser autofill injection */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 100px var(--glass-2) inset !important;
    -webkit-text-fill-color: var(--text-1) !important;
    caret-color: var(--text-1);
    border-color: var(--border-2) !important;
  }
  /* Ensure all inputs in login have same width */
  .login-wrap input[type="text"],
  .login-wrap input[type="password"] {
    width: 100%;
    box-sizing: border-box;
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-brand">
    <span class="login-brand-gem">💎</span>
    <span class="login-brand-name">Vault</span>
  </div>
  <p class="login-title">Anmelden</p>

  {% if locked %}
  <div class="login-locked">
    🔒 Zu viele fehlgeschlagene Versuche.<br>
    Bitte warte noch <strong>{{ lockout_mins }} Minute{{ 'n' if lockout_mins != 1 else '' }}</strong>.
  </div>
  {% elif error %}
  <div class="login-error">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST" autocomplete="on">
    <div class="form-group" style="margin-bottom:1rem">
      <label>Benutzername</label>
      <input type="text" name="username" autocomplete="username"
             value="{{ request.form.get('username','') }}"
             autofocus {% if locked %}disabled{% endif %} required>
    </div>
    <div class="form-group">
      <label>Passwort</label>
      <div style="position:relative">
        <input type="password" name="password" id="pwInput" autocomplete="current-password"
               {% if locked %}disabled{% endif %} required
               style="padding-right:2.8rem;width:100%;box-sizing:border-box">
        <button type="button" onclick="togglePw()" tabindex="-1"
                style="position:absolute;right:.7rem;top:50%;transform:translateY(-50%);
                       background:none;border:none;cursor:pointer;font-size:1rem;color:var(--text-3)">
          👁️
        </button>
      </div>
    </div>
    <div class="remember-row">
      <input type="checkbox" name="remember" id="rememberMe" {% if not locked %}{% endif %}>
      <label for="rememberMe">Angemeldet bleiben (30 Tage)</label>
    </div>
    <button type="submit" class="login-btn" {% if locked %}disabled{% endif %}>
      Anmelden →
    </button>
  </form>

  <p class="login-hint">
    Erster Start? Standard: <code>admin / vault1234</code><br>
    Passwort nach dem Login in den Einstellungen ändern.
  </p>
</div>

<script>
  // Apply saved theme
  const t = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);

  function togglePw() {
    const inp = document.getElementById('pwInput');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>
